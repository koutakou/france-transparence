# Mises à jour de dépendances proposées par Dependabot.
#
# Rythme MENSUEL et propositions GROUPÉES par écosystème : un mainteneur seul
# doit pouvoir tout relire, et chaque proposition passe par la même porte que
# les autres (check `construire` : tests, lint, types, build, contrôles de
# santé). Rien ne fusionne seul.
#
# Pour npm et pip, seules les montées MINEURES et CORRECTIVES sont groupées ;
# chaque montée MAJEURE arrive dans sa propre proposition. La première
# proposition groupée (#117, 15/10/2026) mêlait sept montées dont trois
# majeures (TypeScript 7, ESLint 10, @types/node 26) : typescript-eslint ne
# prenait pas encore TypeScript 7, le build tombait, et les quatre montées
# compatibles restaient bloquées derrière les trois autres.
#
# Les alertes et correctifs de SÉCURITÉ de Dependabot ne dépendent pas de ce
# fichier : ils s'activent dans les réglages du dépôt (Settings → Code security).

version: 2
updates:
  # Actions des workflows, épinglées par SHA complet : sans ce suivi, un SHA
  # figé ne reçoit plus aucun correctif.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Dépendances CI"

  # Application Next (fichier de verrouillage app/package-lock.json).
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      app:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Dépendances app"

  # Pipelines Python (requirements.txt, versions FIGÉES `==`, transitives
  # comprises). C'est la seule voie par laquelle une version publiée en amont
  # entre dans la chaîne : avec des bornes basses, DuckDB 2.0 s'est installé
  # de lui-même et a fait échouer tous les cycles à partir du 22/10/2026.
  # ⚠ DuckDB 2.x exige Python >= 3.11 : la CI (3.14) ne voit pas un échec
  # d'installation sur la venv du serveur (docs/ACTIONS-HUMAINES.md).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      pipelines:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # DuckDB 2.x n'a aucune roue pour Python 3.10 et l'interpréteur de la
    # venv du serveur n'est pas connu : une proposition `duckdb==2.x` passerait
    # au vert en CI (3.14) et échouerait à l'installation sur un serveur en
    # 3.10. À LEVER quand cet interpréteur est relevé en 3.11 ou plus
    # (docs/ACTIONS-HUMAINES.md, section du 11/11/2026, points 1 et 2).
    ignore:
      - dependency-name: "duckdb"
        versions: [">=2.0.0"]
    commit-message:
      prefix: "Dépendances pipelines"
