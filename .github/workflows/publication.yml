# Intégration continue France Transparence — https://francetransparence.fr/
#
# CE WORKFLOW NE PUBLIE RIEN. Le site est servi depuis son propre domaine
# (francetransparence.fr, export statique derrière nginx), construit et
# basculé par `ft-deploy` sur le serveur. La page de redirection de l'ancienne
# adresse GitHub Pages (pages-redirection/) part par son propre workflow,
# pages-redirection.yml, et seulement quand elle change : ce workflow-ci n'a
# donc besoin d'aucun droit Pages.
#
# Ce qui reste, et qui est précieux : la VALIDATION QUOTIDIENNE DU BUILD, dans
# un environnement neuf et indépendant du serveur — ingestion complète de tous
# les pipelines (la liste qui fait autorité est la variable PIPELINES du
# Makefile), tests, lint, types, build statique, contrôles de santé.
#
# CE QU'ELLE N'EST PAS : une vigie qui passerait AVANT le serveur. Le cron de
# 04:45 UTC tombe déjà après `ft-deploy` (05:17 Paris = 03:17 UTC l'été,
# 04:17 l'hiver), et GitHub retarde les déclenchements planifiés sans borne :
# sur les 30 derniers runs planifiés au 15/10/2026, départs réels entre 09:25
# et 12:26 UTC ; du 01/11 au 11/11/2026, entre 11:19 et 13:22 UTC. Une panne amont est donc vue ici LE JOUR MÊME, APRÈS le
# passage du serveur, et AVANT son cycle du lendemain — c'est là que le
# correctif doit tomber.
#
# Trois déclencheurs :
#   - cron quotidien 04:45 UTC (06:45 Paris l'été, 05:45 l'hiver) — après le lot
#     nocturne du JO (~00h30 Paris) et les builds DECP quotidiens : ingestion
#     complète (base NEUVE dans le runner éphémère) → tests → build → contrôles.
#   - push sur main : rebuild du site en réutilisant la dernière base en cache
#     (si aucune : ingestion complète). La fraîcheur affichée reste celle de la
#     base réellement utilisée — honnête par construction.
#   - déclenchement manuel (workflow_dispatch), ingestion forçable.
#
# Toute étape en échec hors proposition de fusion ouvre (ou commente) une
# issue « publication-echec », ASSIGNÉE au propriétaire du dépôt et qui le
# mentionne, avec l'étape, la cible et les lignes d'erreur du jour (job
# `alerter`) ; le premier cycle planifié vert suivant la ferme (job `suivre`).
# Les sentinelles (301 d'élus, extinction du cron) tournent à chaque cycle
# planifié, vert ou rouge (job `veiller`). Le site en ligne, lui, ne dépend pas
# de ce workflow : c'est vigie.yml qui le regarde.

name: publication

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:
    inputs:
      ingestion:
        description: "Ingestion complète (base neuve) ; sinon réutilise la base en cache"
        type: boolean
        default: true
  push:
    branches: [main]
  # Une proposition de fusion doit être vérifiée AVANT d'atteindre main, pas
  # après : c'est main qui alimente le serveur de production.
  pull_request:
    branches: [main]

# Droits minimaux, job par job. `construire` exécute du code tiers (scripts
# d'installation npm, téléchargements des pipelines) : il ne reçoit que la
# lecture du dépôt, comme `tests-python-3-10`. Seuls `alerter`, `suivre` et
# `veiller`, qui n'exécutent que `gh` et les scripts de deploy/ (bibliothèque
# standard seule), écrivent des issues.
permissions:
  contents: read

concurrency:
  # Par référence : une vérification de proposition de fusion ne doit ni
  # bloquer ni être bloquée par le cycle quotidien de main.
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construire:
    # Image ÉPINGLÉE : `ubuntu-latest` bascule vers Ubuntu 26 à partir du
    # 19/10/2026 (annonce de GitHub sur les runs d'octobre). La chaîne
    # (CPython 3.14 de setup-python, better-sqlite3, build Next) est prouvée
    # sur 24.04 ; le passage à 26.04 se fera par une proposition de fusion
    # dont la CI fera la preuve, pas par un changement d'image subi.
    runs-on: ubuntu-24.04
    # Trois fois le plus long run observé (10 à 14 min, ingestion comprise, sur
    # les 30 derniers au 15/10/2026) : un amont qui pend ne bloque plus le
    # runner deux heures et demie.
    timeout-minutes: 45
    # Ce que `veiller` lit pour tenir l'issue des 301 d'élus (voir l'étape
    # « Cohérence des redirections 301 »).
    outputs:
      r301_anomalies: ${{ steps.r301.outputs.anomalies }}
      r301_detail: ${{ steps.r301.outputs.detail }}
    steps:
      # Actions épinglées par SHA complet de commit (une étiquette se déplace,
      # un SHA non), version en commentaire ; dependabot (.github/dependabot.yml)
      # les tient à jour. Toutes ciblent Node 24 (Node 20 est déprécié sur les
      # runners).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mode d'exécution
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.ingestion }}" = "true" ]; }; then
            echo "ingestion=oui" >> "$GITHUB_OUTPUT"
          else
            echo "ingestion=si-cache-vide" >> "$GITHUB_OUTPUT"
          fi

      # Le préfixe de cache porte l'EMPREINTE DES PIPELINES. C'est ce qui évite
      # la panne suivante, constatée le 20/08/2026 : une proposition de fusion
      # qui ajoutait une table a restauré la base mise en cache par le cycle de
      # la veille — donc l'ANCIEN schéma — et le build est mort sur
      # « no such table: partis_aide_annuelle ». Le même échec attendait main
      # après la fusion.
      #
      # Le schéma de data/france.db est produit par pipelines/*.py et par rien
      # d'autre : si l'un d'eux change, l'empreinte change, aucun cache ne
      # correspond, et le job retombe sur l'ingestion complète — ce que le
      # `if:` de l'étape suivante prévoit déjà. `requirements.txt` entre dans
      # l'empreinte depuis le 11/11/2026 : le CONTENU de la base dépend aussi
      # des versions figées (DuckDB lit les Parquet et les CSV volumineux), et
      # une montée de version doit rejouer l'ingestion. Les tests sont volontairement
      # hors de l'empreinte (pipelines/*.py, pas pipelines/**/*.py) : ils ne
      # produisent aucun schéma, et les inclure ferait rejouer 90 s d'ingestion
      # à chaque test ajouté.
      - name: Restaurer la dernière base en cache
        if: steps.mode.outputs.ingestion != 'oui'
        id: cache-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/france.db
          # clé volontairement introuvable : on veut le restore-keys → la base
          # la plus récente PARMI CELLES DU MÊME SCHÉMA
          key: france-db-introuvable
          restore-keys: |
            france-db-${{ hashFiles('pipelines/*.py', 'requirements.txt') }}-

      # INCONDITIONNEL depuis le 25/08/2026 : les tests tournent désormais à chaque
      # événement (voir l'étape « Tests pipelines »), y compris quand l'ingestion est
      # sautée. Sans cette étape, `make venv` retomberait sur le python3 de l'image
      # (3.12 sur ubuntu-24.04) et les tests d'une proposition de fusion ne
      # tourneraient pas sur le même interpréteur que ceux du cycle quotidien.
      # Le coût est nul : l'étape est mesurée à 0 s quand la version est déjà en cache.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Ingestion complète (base neuve du jour)
        id: ingestion
        if: steps.mode.outputs.ingestion == 'oui' || steps.cache-db.outputs.cache-matched-key == ''
        run: |
          make venv PYTHON=python3
          make ingest PYTHON=python3

      # LA BASE EST MISE EN CACHE DÈS QUE L'INGESTION A RÉUSSI, avant les tests.
      # Ces deux étapes suivaient les tests : un test en échec les sautait.
      # Du 22/10 au 11/11/2026, pytest a échoué treize fois APRÈS une ingestion
      # complète réussie, et aucune de ces treize bases n'a été gardée ; les
      # caches antérieurs ont expiré (sept jours sans lecture) et l'API en
      # comptait zéro le 11/11. Chaque poussée et chaque proposition de fusion
      # refaisait alors l'ingestion complète et héritait des pannes amont du
      # jour — y compris la proposition qui corrigeait le test.
      #
      # Ce que le cache est, et n'est pas : un raccourci de VALIDATION pour
      # les poussées et les propositions de fusion (ce workflow ne publie
      # rien, et le serveur ne lit jamais ce cache). Les tests valident le
      # CODE, sur leurs propres bases jetables ; aucun ne lit cette base. Une
      # base issue d'une ingestion réussie est donc aussi valide avant les
      # tests qu'après. Et un run qui la restaure rejoue de toute façon les
      # tests, le build et les contrôles de santé : elle ne rend rien vert.
      #
      # La garde est dans la CLÉ : la base n'est restaurée que par le même
      # code de pipelines ET les mêmes dépendances (`requirements.txt`, figé).
      # Sans ce second terme, une montée de DuckDB aurait été validée sur une
      # base produite par l'ancienne version, sans jamais rejouer l'ingestion.
      - name: Consolider la base (checkpoint WAL → fichier unique)
        if: steps.ingestion.outcome == 'success'
        run: |
          python3 - <<'EOF'
          import sqlite3
          c = sqlite3.connect("data/france.db")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.execute("PRAGMA journal_mode=DELETE")
          c.close()
          EOF
          ls -lh data/france.db

      - name: Mettre la base en cache
        if: steps.ingestion.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/france.db
          # Même empreinte que le restore-keys ci-dessus : une base n'est
          # réutilisable que par un code et des dépendances identiques.
          key: france-db-${{ hashFiles('pipelines/*.py', 'requirements.txt') }}-${{ github.run_id }}

      # LE GARDE-FOU. Cette étape portait `if: steps.ingestion.outcome == 'success'`,
      # ce qui liait les tests au REMPLISSAGE DU CACHE et non au contenu proposé :
      # dès que la base du jour était restaurée, l'ingestion était sautée et pytest
      # avec elle. Mesuré par l'API le 25/08/2026 : 35 des 51 poussées sur main
      # depuis le 22/08 (69 %) portaient `Tests pipelines (pytest) -> skipped`, et
      # les 51 runs étaient pourtant conclus `success` — une CI verte ne prouvait
      # rien. Les propositions de fusion étaient touchées dans la même proportion
      # (39 sur 56), donc le trou était AVANT la fusion autant qu'après.
      #
      # Le lien n'avait aucune raison technique : aucun test n'a besoin de la base
      # servie. Chaque fichier de `pipelines/tests` construit sa base dans
      # `tmp_path`, et `pipelines/db.py` lit `FT_DB_PATH`, détourné par les tests
      # qui font tourner un pipeline entier. Mesuré le 25/08/2026 sur un arbre SANS
      # `data/france.db` (33 fichiers de tests à cette date) : 600 passed,
      # 1 skipped, 20 deselected en 9 s, et la suite ne crée aucune base. Seul
      # saut : un test de lobbying qui veut un CSV brut. Ces comptes datent : le
      # journal de chaque run donne ceux du jour.
      #
      # `-m 'not reseau'` écarte les tests qui appellent les sources amont. Ils
      # sont joués juste en dessous, mais seulement quand l'ingestion a tourné : les
      # faire jouer à chaque proposition de fusion rendrait la fusion tributaire de
      # la disponibilité d'API tierces. `ft-deploy` applique déjà la même règle.
      - name: Tests pipelines (pytest)
        run: make test PYTHON=python3 PYTEST_ARGS="-m 'not reseau'"

      # Les tests marqués `reseau` interrogent réellement l'amont. Ils gardent
      # l'ancienne condition : quand l'ingestion vient de tourner, le réseau a déjà
      # été sollicité et une panne amont est justement ce qu'on veut apprendre ici.
      - name: Tests réseau (sources amont)
        if: steps.ingestion.outcome == 'success'
        run: make test PYTHON=python3 PYTEST_ARGS="-m reseau"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dépendances app
        run: npm ci
        working-directory: app

      # Les tests de l'app (`node --test`, app/tests/*.test.mjs) n'étaient
      # joués par rien ni personne avant la fusion. Ils ne lisent pas
      # data/france.db (chaque fichier crée sa base SQLite jetable) : l'étape
      # tourne donc à l'identique en mode ingestion et en mode cache, sans `if:`.
      - name: Tests app (npm test)
        run: npm test
        working-directory: app

      # Depuis Next 16, `next build` ne lance plus ESLint : sans cette étape, le
      # lint n'était joué par rien ni personne avant la fusion.
      - name: Lint app (ESLint)
        run: npm run lint
        working-directory: app

      # `tsc` seul échoue sur un arbre neuf : les types globaux de route
      # (`LayoutProps`, `PageProps`) n'existent qu'après `next typegen`. Le build
      # vérifie aussi les types, mais cette étape les vérifie SANS base et
      # avant lui, et nomme l'erreur au lieu de la noyer dans le journal du build.
      - name: Types app (next typegen + tsc)
        run: |
          npx next typegen
          npx tsc --noEmit
        working-directory: app

      # Sans NEXT_PUBLIC_BASE_PATH : on valide la configuration RÉELLEMENT
      # servie en production (site à la racine d'un domaine), pas celle d'une
      # « project page » GitHub Pages qui n'est plus publiée.
      - name: Build statique
        run: npm run build
        working-directory: app
        env:
          FT_EXPORT: "1"
          FRANCE_DB_PATH: ${{ github.workspace }}/data/france.db

      # Budget de poids : < 500 Ko de HTML brut par page, fragment chargé sans
      # geste compris (app/scripts/poids-pages.mjs, testé par npm test). Quatre
      # pages l'avaient dépassé sans qu'aucun contrôle ne le voie (725 Ko pour
      # /lobbying le 15/10/2026). Les pages les plus lourdes sont journalisées
      # à chaque passage, même au vert.
      - name: Budget de poids des pages
        run: node scripts/poids-pages.mjs out
        working-directory: app

      - name: Contrôles de santé du site généré
        run: |
          set -eu
          test -f app/out/index.html
          grep -q "France Transparence" app/out/index.html
          python3 - <<'EOF'
          import json, pathlib, sys
          meta = json.loads(pathlib.Path("app/out/api/meta.json").read_text())
          brut = json.dumps(meta)
          assert "genere_le" in brut, "meta.json sans champ genere_le"
          print("meta.json OK :", str(meta)[:200])
          EOF
          nb_fiches=$(find app/out/elus -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Fiches élus générées : $nb_fiches"
          test "$nb_fiches" -ge 900
          # Le seuil ci-dessus a 130+ de marge : un écart de six fiches passe
          # dessous sans le frôler. Ce qui manquait n'était pas un seuil plus
          # serré (il dériverait), c'est la COHÉRENCE entre les deux
          # populations. Le sitemap a annoncé des /elus/<id> que le build ne
          # générait pas pendant six jours et douze déploiements, sans qu'aucun
          # contrôle les compare : des 404 servis aux moteurs, en silence.
          # Les deux sens sont vérifiés — le second interdit qu'une fiche
          # réellement publiée cesse d'être annoncée.
          python3 - <<'EOF'
          import pathlib, re, sys, urllib.parse
          out = pathlib.Path("app/out")
          locs = re.findall(r"<loc>([^<]*)</loc>", (out / "sitemap.xml").read_text())
          # Découper sur le CHEMIN, pas sur la chaîne : `/elus/` est aussi la
          # page de liste, et un rsplit naïf y lève IndexError — le garde-fou
          # aurait échoué à tous les coups, y compris sur un site sain.
          annonces = set()
          for u in locs:
              chemin = urllib.parse.urlsplit(u).path
              if chemin.startswith("/elus/") and chemin.strip("/") != "elus":
                  annonces.add(urllib.parse.unquote(chemin.strip("/")[len("elus/"):]))
          generees = {d.name for d in (out / "elus").iterdir() if d.is_dir()}
          fantomes = sorted(annonces - generees)
          muettes = sorted(generees - annonces)
          print(f"Fiches annoncées au sitemap : {len(annonces)} — générées : {len(generees)}")
          for f in fantomes[:20]:
              print(f"  ÉCHEC : /elus/{f}/ est au sitemap sans page générée (404 servi)")
          for m in muettes[:20]:
              print(f"  ÉCHEC : /elus/{m}/ est générée mais absente du sitemap")
          sys.exit(1 if fantomes or muettes else 0)
          EOF
          taille=$(du -sm app/out | cut -f1)
          echo "Taille du site : ${taille} Mo"
          test "$taille" -lt 950
          # Référencement : une page sans canonique est une régression
          # silencieuse — on la traite comme un échec de build.
          sans_canonique=$(grep -rL 'rel="canonical"' --include=index.html app/out \
            | grep -v -e '/404/' -e '/_not-found/' | wc -l)
          echo "Pages sans <link rel=canonical> : $sans_canonique"
          test "$sans_canonique" -eq 0
          grep -q 'application/ld+json' app/out/index.html
          grep -q 'application/ld+json' app/out/donnees/index.html
          # Identité de déploiement — le site est servi à la racine de
          # francetransparence.fr. L'ancienne adresse GitHub Pages ne doit plus
          # apparaître NULLE PART dans l'export : une canonique, un lien de
          # sitemap ou une carte de partage qui la porte encore renvoie les
          # moteurs vers un site qui n'existe plus. (La page de redirection de
          # pages-redirection/ la cite légitimement, mais elle n'est pas dans
          # l'export : elle est envoyée telle quelle sur GitHub Pages.)
          echo "Références résiduelles à l'ancienne adresse GitHub Pages :"
          if grep -rl 'koutakou\.github\.io' app/out; then
            echo "ÉCHEC : l'export contient encore koutakou.github.io" >&2
            exit 1
          fi
          echo "  aucune"
          # robots.txt est GÉNÉRÉ (app/src/app/robots.ts) à partir de SITE_URL :
          # s'il disparaît de l'export, ou s'il annonce un sitemap qui n'est pas
          # celui du site, l'indexation part de travers en silence.
          test -f app/out/robots.txt
          cat app/out/robots.txt
          grep -qx 'Sitemap: https://francetransparence\.fr/sitemap\.xml' app/out/robots.txt

      # --- Redirections 301 des fiches fusionnées (R1a et R1c) --------------
      #
      # 🛑 IL MANQUE UN TROISIÈME CONTRÔLE ICI, ET C'EST VOULU — NE LE CHERCHE PAS.
      # La chaîne met en jeu TROIS artefacts : ① la table (ce dépôt), ② le build
      # (ci-dessous), ③ le SNIPPET nginx /etc/nginx/snippets/ft-redirections-elus-pages.conf,
      # HORS DÉPÔT, posé à la main par /root/poser-301-d22.sh.
      # R1a et R1c rapprochent ① et ②. Le rapprochement ① <-> ③ est
      # STRUCTURELLEMENT IMPOSSIBLE ICI : ce runner n'a ni /etc/nginx ni le site
      # servi, et ce workflow n'a ni ssh ni rsync — il ne peut ni lire ③ ni
      # l'interroger. Ce contrôle-là vit donc UNE SEULE FOIS, côté serveur, dans
      # /usr/local/bin/ft-controle-301, appelé par ft-deploy et par ft-rollback.
      # Exception assumée à la règle « toute garde se pose deux fois ».
      # Voir docs/REDIRECTIONS-ELUS.md, § « Le contrôle de dérive vit CÔTÉ SERVEUR ».
      # Source : /srv/france-transparence/doc/QUALIFICATION-301-DERIVE-20260826.md
      # § 9 — chemin ABSOLU sur le serveur : ce document vit HORS du dépôt (le
      # dépôt porte `docs/`, pas `doc/`). Miroir de l'étape équivalente de
      # `ft-deploy`, lui-même NON VERSIONNÉ : toute garde se pose deux fois, à
      # la main, et une réinstallation efface celle du serveur.
      #
      # 🛑 CES CONTRÔLES NE FONT PAS ÉCHOUER LE JOB, et c'est délibéré.
      # Une cible qui perd sa page est un événement NORMAL : le jour où un
      # député cible perd son mandat, sa fiche sort du site. Un `exit 1` ici
      # rendrait rouge toute proposition de fusion, quel que soit son sujet,
      # sur un événement garanti à échéance et qui se règle dans la table.
      #
      # MAIS UN AVERTISSEMENT SEUL NE SUFFISAIT PAS. Du 05/10 au 15/10/2026,
      # chacun des dix runs verts a porté « R1a — … SEN-21634U SEN-20130U » :
      # deux 301 menaient à un 404 en production (renouvellement sénatorial du
      # 27/09), et personne ne l'a lu — un `::warning::` n'apparaît que dans le
      # résumé d'un run vert. L'étape publie donc son verdict en sortie, et le
      # job `veiller` en tient une issue `redirections-301` sur les cycles
      # planifiés : ouverte (ou commentée) tant qu'une anomalie demeure, fermée
      # au premier cycle propre.
      #
      # Ce que chacun attrape :
      #   R1a — une CIBLE de la table n'est plus SERVIE : le 301 pointe
      #         désormais vers un 404, et l'ancienne fiche est perdue pour de
      #         bon (l'URL retirée ne rend même plus la jumelle).
      #   R1c — une SOURCE de la table est de nouveau engendrée (résurrection
      #         par le pipeline) : la page existe, mais nginx la masque
      #         derrière le 301 — publiée et invisible, en silence.
      #
      # Ce qui N'EST PAS ici, et pourquoi : le sens « fiche sortie du site sans
      # ligne dans la table » (R1b) exige l'arborescence out/elus de la release
      # PRÉCÉDENTE. Elle n'existe que sur le serveur (GARDER=5) ; un runner ne
      # met en cache que data/france.db. Le prescrire ici serait prescrire un
      # contrôle structurellement incalculable. Il vit dans ft-deploy seul.
      # Et ni l'un ni l'autre ne rapproche la table du SNIPPET nginx installé :
      # c'est le chantier P-SNIPPET-DERIVE, ouvert, non qualifié.
      - name: Cohérence des redirections 301 d'élus (avertit, ne bloque pas)
        id: r301
        run: |
          set -u
          # Verdict publié pour le job `veiller`, posé AVANT toute sortie
          # anticipée : une table illisible est une anomalie, pas un silence.
          verdict() {
            echo "anomalies=$1" >> "$GITHUB_OUTPUT"
            echo "detail=$2" >> "$GITHUB_OUTPUT"
          }
          table=deploy/redirections-elus.tsv
          if [ ! -r "$table" ]; then
            echo "::warning::$table illisible : le contrôle des 301 n'a pas été joué"
            verdict oui "Table $table illisible : le contrôle des 301 n'a pas été joué."
            exit 0
          fi
          n=0; nc=0; absentes=; ressuscitees=; malformees=
          # `|| [ -n "${retire:-}" ]` : sans ce garde, une table sans saut de
          # ligne final PERD SA DERNIÈRE LIGNE en silence, et l'étape annonce
          # « les n cibles sont engendrées » sans avoir testé la dernière.
          while IFS=$'\t' read -r retire conserve _reste || [ -n "${retire:-}" ]; do
            case "$retire" in ''|'#'*) continue ;; esac
            n=$((n + 1))
            # Une deuxième colonne VIDE rendrait `[ -d app/out/elus/ ]` VRAI —
            # le répertoire parent existe toujours : R1a passerait à blanc.
            if [ -z "${conserve:-}" ]; then
              malformees="$malformees $retire"
            # On teste `index.html`, pas le répertoire : c'est le fichier que
            # nginx sert, et un répertoire vide rend 404 en silence.
            else
              nc=$((nc + 1))
              [ -f "app/out/elus/$conserve/index.html" ] || absentes="$absentes $conserve"
            fi
            [ ! -d "app/out/elus/$retire" ] || ressuscitees="$ressuscitees $retire"
          done < "$table"
          echo "Table des redirections : $n ligne(s)."
          # Plancher : sans lui, une table VIDÉE ou TRONQUÉE rend « 0 ligne » et
          # l'étape passe au vert, alors que nginx sert encore ses redirections.
          if [ "$n" -eq 0 ]; then
            echo "::warning::La table des 301 est LUE mais VIDE (0 ligne utile) — plus rien n'est contrôlé"
          fi
          if [ -n "$absentes" ]; then
            echo "::warning::R1a — cible(s) de la table non servie(s), le 301 pointe vers un 404 :$absentes"
          elif [ "$n" -gt 0 ]; then
            echo "  R1a : les $nc cible(s) complète(s) sont servies."
          fi
          if [ -n "$ressuscitees" ]; then
            echo "::warning::R1c — source(s) de la table de nouveau engendrée(s), masquée(s) par le 301 :$ressuscitees"
          elif [ "$n" -gt 0 ]; then
            echo "  R1c : aucune source ressuscitée."
          fi
          if [ -n "$malformees" ]; then
            echo "::warning::Table des 301 — ligne(s) sans deuxième colonne, jamais vérifiées :$malformees"
          fi
          detail=
          [ "$n" -gt 0 ] || detail="$detail Table lue mais VIDE (0 ligne utile)."
          [ -z "$absentes" ] || detail="$detail R1a, cible(s) non servie(s), le 301 mène à un 404 :$absentes."
          [ -z "$ressuscitees" ] || detail="$detail R1c, source(s) de nouveau engendrée(s), masquée(s) par le 301 :$ressuscitees."
          [ -z "$malformees" ] || detail="$detail Ligne(s) sans deuxième colonne :$malformees."
          if [ -n "$detail" ]; then verdict oui "${detail# }"; else verdict non "$n ligne(s), aucune anomalie"; fi

  # Le serveur de production n'est pas tenu de tourner sous le Python de
  # `construire` (3.14) : sa venv peut dater d'Ubuntu 22.04, donc de 3.10.
  # `requirements.txt` est figé pour s'installer sous les deux. Sans ce job,
  # une montée de version qui abandonne 3.10 (DuckDB 2.0 n'a aucune roue
  # cp310) serait verte ici et échouerait à l'installation sur le serveur.
  # Volontairement léger : ni ingestion ni réseau amont, la même recette
  # `make test` que `construire`, sous l'autre interpréteur.
  tests-python-3-10:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Tests pipelines sous Python 3.10 (installation de requirements.txt comprise)
        run: |
          python3 --version
          make venv PYTHON=python3
          make test PYTHON=python3 PYTEST_ARGS="-m 'not reseau'"

  # L'ALERTE A UN DESTINATAIRE. Du 22/10 au 11/11/2026, vingt et un cycles
  # planifiés ont échoué et l'issue #126 a reçu vingt commentaires : personne
  # ne les a vus. Le dépôt n'avait aucun abonné, l'issue personne d'assigné,
  # les commentaires aucune mention — GitHub ne notifie alors personne.
  # L'issue est désormais ASSIGNÉE au propriétaire du dépôt et chaque
  # commentaire le MENTIONNE (deploy/tenir_issue.py).
  #
  # ELLE DIT CE QUI EST TOMBÉ. Huit de ces vingt et un runs étaient tombés
  # pour une autre raison que les treize autres (cinq pipelines, quatre
  # serveurs amont) sous vingt commentaires identiques. Le commentaire nomme
  # le job, l'étape, la cible `make` et la première et la dernière ligne
  # d'erreur (deploy/diagnostic_ci.py, sur le journal du job) ; le titre est
  # tenu à jour : « CI rouge depuis le 22/10 (21 jours) — aujourd'hui :
  # ingest-parlement ». Au-delà de sept jours, une issue de relance distincte
  # s'ouvre, une par semaine.
  #
  # `always()` et non `failure()` : un job interrompu (délai dépassé) doit
  # alerter comme un job en échec.
  alerter:
    needs: [construire, tests-python-3-10]
    # Un échec sur une proposition de fusion est déjà visible sur la
    # proposition elle-même : ouvrir une issue n'ajouterait que du bruit.
    if: always() && github.event_name != 'pull_request' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # Lecture du journal du job tombé, pour le diagnostic.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Le texte disait jusqu'au 15/10/2026 « Le site en ligne reste celui du
      # dernier déploiement réussi » : vrai au temps de GitHub Pages, faux
      # depuis le 20/08 — ce run ne déploie rien, et son échec ne dit RIEN de
      # l'état du site. La tentative figure dans le corps : un run relancé
      # commentait deux fois sous le même identifiant (run 37196390136, 04/10).
      #
      # Le diagnostic ne doit JAMAIS empêcher l'alerte : chacun de ses gestes
      # a son repli, et un champ non trouvé est écrit comme tel.
      - name: Ouvrir ou commenter l'issue d'échec
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          PROPRIETAIRE: ${{ github.repository_owner }}
          EVENEMENT: ${{ github.event_name }}
          REFERENCE: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
          TENTATIVE: ${{ github.run_attempt }}
        run: |
          set -eu
          lien="$GITHUB_SERVER_URL/$DEPOT/actions/runs/$RUN/attempts/$TENTATIVE"

          # Job et étape tombés, lus dans l'API : quatre lignes (identifiant,
          # job, conclusion, étape), vides si l'API ne répond pas.
          gh api "repos/$DEPOT/actions/runs/$RUN/attempts/$TENTATIVE/jobs" --jq '
            [.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")][0]
            | [(.id // ""), (.name // ""), (.conclusion // ""),
               ([(.steps // [])[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")][0].name // "")]
            | .[]' > tombe.txt || : > tombe.txt
          mapfile -t tombe < tombe.txt
          job_id="${tombe[0]:-}"; job="${tombe[1]:-}"; conclusion="${tombe[2]:-}"; etape="${tombe[3]:-}"

          # `curl` et non `gh api` : le journal porte des séquences
          # d'échappement de terminal, que `gh` refuse de restituer.
          : > journal.txt
          if [ -n "$job_id" ]; then
            curl -fsSL --max-time 120 -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$DEPOT/actions/jobs/$job_id/logs" -o journal.txt \
              || echo "::warning::Journal du job $job_id illisible : diagnostic réduit au nom de l'étape"
          fi
          python3 deploy/diagnostic_ci.py journal.txt > diagnostic.json || echo '{}' > diagnostic.json
          cible=$(jq -r '.cible // ""' diagnostic.json)
          premiere=$(jq -r '.premiere // ""' diagnostic.json)
          derniere=$(jq -r '.derniere // ""' diagnostic.json)

          # Ce qui nomme la panne du jour, dans le titre et dans le marqueur
          # d'état : la cible d'ingestion si c'en est une, sinon l'étape.
          case "$cible" in
            ingest-*) motif="$cible" ;;
            *) motif="${etape:-${job:-cause non relevée}}" ;;
          esac
          echo "Tombé : job=${job:-?} (${conclusion:-?}) étape=${etape:-?} cible=${cible:-aucune} — motif : $motif"

          {
            echo "**CI rouge depuis le {depuis} ({duree}).** Le run [$RUN, tentative $TENTATIVE]($lien) du $(date -u +%d/%m/%Y) a échoué (événement : $EVENEMENT, référence : $REFERENCE)."
            echo
            echo "- Job : \`${job:-non relevé}\` (${conclusion:-conclusion non relevée})"
            echo "- Étape tombée : \`${etape:-non relevée}\`"
            echo "- Cible \`make\` : \`${cible:-aucune}\`"
            echo "- Run rouge précédent : \`{precedent}\`"
            echo
            if [ -n "$premiere" ]; then
              echo "Première ligne d'erreur :"
              printf '%s\n' "\`\`\`" "$premiere" "\`\`\`"
              echo "Dernière ligne d'erreur :"
              printf '%s\n' "\`\`\`" "$derniere" "\`\`\`"
            else
              echo "Aucune ligne d'erreur relevée dans le journal (job interrompu, ou journal illisible) : lire le run."
            fi
            echo
            echo "Ce workflow VALIDE le code et les sources amont ; il ne publie pas le site. francetransparence.fr est construit et basculé par ft-deploy sur le serveur, indépendamment : ce run rouge ne dit rien de l'état du site en ligne (c'est l'issue \`site-fige\` de la vigie qui le dit). Une panne amont vue ici a pu aussi arrêter le cycle du serveur (le vérifier avec ft-etat) ; un défaut de code est à corriger avant le cycle suivant. Voir docs/deploiement/RUNBOOK.md."
            echo
            echo "Cette issue se ferme d'elle-même au premier cycle planifié vert."
          } > corps.md

          python3 deploy/tenir_issue.py signaler --label publication-echec \
            --titre "CI rouge depuis le {depuis} ({duree}) — aujourd'hui : $motif" \
            --corps-fichier corps.md --etat "$motif" --couleur D93F0B \
            --description "La validation CI a échoué — le site en ligne n'est pas concerné"
          python3 deploy/tenir_issue.py relancer --label publication-echec \
            --label-relance ci-rouge-persistant \
            --titre "La validation CI est rouge depuis {duree} — relance"

  # Le pendant de `alerter`, qui manquait : rien ne fermait jamais l'issue
  # d'échec. #105, ouverte le 12/09/2026 sur un run depuis relancé et conclu
  # vert, l'était encore le 15/10, après neuf cycles planifiés verts d'affilée
  # — une alerte qui ne s'éteint pas cesse d'être lue.
  #
  # Seuls les cycles PLANIFIÉS font foi : ingestion complète dans une base
  # neuve, c'est la preuve la plus forte que la chaîne tient. Un push vert sur
  # base en cache ne prouve pas qu'une panne amont est passée.
  suivre:
    needs: [construire, tests-python-3-10]
    if: github.event_name == 'schedule' && needs.construire.result == 'success' && needs.tests-python-3-10.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEPOT: ${{ github.repository }}
      LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fermer l'issue d'échec de validation (cycle planifié vert)
        run: |
          set -eu
          message="Rétabli : le cycle planifié [${{ github.run_id }}]($LIEN) du $(date -u +%F) est vert (ingestion complète, tests, build, contrôles de santé)."
          python3 deploy/tenir_issue.py retablir --label publication-echec \
            --message "$message" --titre "CI rouge du {depuis} au $(date -u +%d/%m) — rétablie"
          python3 deploy/tenir_issue.py retablir --label ci-rouge-persistant --message "$message"

  # LES SENTINELLES NE DÉPENDENT PAS DE CE QU'ELLES SURVEILLENT. L'issue des
  # 301 d'élus et l'avertissement d'extinction du cron vivaient dans `suivre`,
  # qui ne tourne que sur cycle VERT : du 22/10 au 11/11/2026, vingt et un
  # runs rouges, vingt et un `suivre → skipped`. L'avertissement d'extinction
  # (dû le 29/11, pour une extinction vers le 14/12) ne serait jamais parti,
  # et le cron éteint aurait fait taire jusqu'à l'issue d'échec.
  #
  # Ce job tourne donc à CHAQUE cycle planifié, quel que soit le sort de
  # `construire` (`always()`). Il l'attend seulement pour lire le verdict des
  # 301, quand il existe.
  veiller:
    needs: construire
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # Réactivation préventive des workflows planifiés (dernière étape).
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEPOT: ${{ github.repository }}
      PROPRIETAIRE: ${{ github.repository_owner }}
      LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tenue de l'issue des 301 d'élus à partir du verdict de `construire`.
      # Toujours une ligne au journal, anomalie ou non : un contrôle muet au
      # vert est indiscernable d'un contrôle débranché. Si `construire` est
      # tombé avant le contrôle, il n'y a pas de verdict : c'est dit, et
      # l'issue reste dans l'état où elle était.
      - name: Tenir l'issue des redirections 301 d'élus
        env:
          ANOMALIES: ${{ needs.construire.outputs.r301_anomalies }}
          DETAIL: ${{ needs.construire.outputs.r301_detail }}
          RESULTAT: ${{ needs.construire.result }}
        run: |
          set -eu
          echo "Verdict 301 : anomalies=${ANOMALIES:-absent} — ${DETAIL:-aucun détail} (construire : $RESULTAT)"
          if [ "${ANOMALIES:-}" = "oui" ]; then
            {
              echo "Cycle planifié [${{ github.run_id }}]($LIEN) du $(date -u +%F) : $DETAIL"
              echo
              echo "La table deploy/redirections-elus.tsv est la source de vérité du snippet nginx des 301 d'élus. Procédure : docs/REDIRECTIONS-ELUS.md (corriger la table par une proposition de fusion, puis, après le déploiement, rejouer /root/poser-301-d22.sh sur le serveur). Cette issue est relancée une fois par semaine tant que le constat ne change pas, et se ferme d'elle-même au premier cycle planifié sans anomalie."
            } > corps.md
            python3 deploy/tenir_issue.py signaler --label redirections-301 \
              --titre "Redirections 301 d'élus : la table ne correspond plus aux fiches servies" \
              --corps-fichier corps.md --etat "$(printf '%s' "$DETAIL" | sha256sum | cut -c1-16)" \
              --relance-jours 7 --couleur FBCA04 \
              --description "Une redirection 301 d'élu mène à un 404 ou masque une fiche servie"
          elif [ "${ANOMALIES:-}" = "non" ]; then
            python3 deploy/tenir_issue.py retablir --label redirections-301 \
              --message "Rétabli : le cycle planifié [${{ github.run_id }}]($LIEN) du $(date -u +%F) ne relève plus d'anomalie ($DETAIL). Le snippet nginx du serveur, hors dépôt, se vérifie par ft-controle-301."
          else
            echo "::warning::Le contrôle des 301 n'a publié aucun verdict (construire : $RESULTAT) : l'issue redirections-301 n'est pas tenue ce jour."
          fi

      # GitHub DÉSACTIVE les workflows planifiés d'un dépôt public après 60 jours
      # sans activité, sans qu'aucune issue ne s'ouvre : un run qui n'a pas lieu
      # n'échoue pas. Cette CI et la vigie étant les seules sentinelles
      # indépendantes du serveur, leur extinction serait silencieuse.
      #
      # Deux mesures, sans activité factice (aucun commit automatique) :
      #   1. PRÉVENIR quinze jours avant, par une issue assignée, à partir de
      #      la date du dernier commit de main — la référence la plus prudente
      #      de ce qui compte comme activité ;
      #   2. RÉACTIVER les deux workflows planifiés par l'API à partir du même
      #      seuil (`PUT …/actions/workflows/<fichier>/enable`). L'usage veut
      #      que cet appel remette le compteur à zéro ; GITHUB NE LE DOCUMENTE
      #      PAS. C'est donc un filet, pas une garantie : l'avertissement
      #      reste, et il dit si le cron a survécu à l'échéance.
      #
      # La branche vient de `github.ref_name`, pas de
      # `github.event.repository.default_branch` : un événement `schedule` n'a
      # pas de charge utile de webhook (« Not applicable » dans la
      # documentation de GitHub), l'expression y serait vide et l'appel
      # `repos/…/commits/` rendrait une LISTE — l'étape échouerait chaque nuit.
      # Sur `schedule`, GITHUB_REF est documenté comme la branche par défaut.
      - name: Échéance d'extinction du cron (60 jours sans activité)
        env:
          BRANCHE: ${{ github.ref_name }}
        run: |
          set -eu
          dernier=$(gh api "repos/$DEPOT/commits/$BRANCHE" --jq .commit.committer.date)
          age=$(( ( $(date -u +%s) - $(date -u -d "$dernier" +%s) ) / 86400 ))
          echeance=$(date -u -d "$dernier + 60 days" +%F)
          echo "Dernier commit sur $BRANCHE : $dernier, il y a $age jour(s) ; extinction du cron vers le $echeance sans nouvelle activité."
          if [ "$age" -lt 45 ]; then
            echo "Réactivation préventive : non jouée avant le 45e jour."
            python3 deploy/tenir_issue.py retablir --label cron-echeance \
              --message "Échéance repoussée : dernier commit sur $BRANCHE il y a $age jour(s), extinction vers le $echeance."
            exit 0
          fi
          reactivation=
          for fichier in publication.yml vigie.yml; do
            if gh api -X PUT "repos/$DEPOT/actions/workflows/$fichier/enable" >/dev/null; then
              echo "Réactivation préventive de $fichier : acceptée par l'API."
              reactivation="$reactivation $fichier : acceptée ;"
            else
              echo "::warning::Réactivation préventive de $fichier refusée par l'API"
              reactivation="$reactivation $fichier : REFUSÉE ;"
            fi
          done
          if [ "$age" -lt 60 ]; then
            etat="avant-$echeance"
            titre="La validation CI et la vigie s'éteindront vers le $echeance faute d'activité"
            constat="GitHub désactive les workflows planifiés d'un dépôt public après 60 jours sans activité : la validation quotidienne et la vigie du site s'éteindraient vers le $echeance, en silence."
          else
            etat="apres-$echeance"
            titre="Aucune activité depuis $age jours : la validation CI et la vigie ne tiennent que par réactivation"
            constat="L'échéance des 60 jours ($echeance) est passée et ce cycle planifié a pourtant tourné : la réactivation préventive tient, ou GitHub compte une autre activité que les commits de $BRANCHE. Rien ne garantit que cela dure."
          fi
          {
            echo "Le dernier commit sur $BRANCHE date du $dernier ($age jours). $constat"
            echo
            echo "Réactivation préventive jouée à ce cycle (effet non documenté par GitHub) :$reactivation"
            echo
            echo "Toute fusion sur $BRANCHE repousse l'échéance pour de bon. Si GitHub a désactivé les workflows : gh workflow enable publication.yml --repo $DEPOT, puis de même pour vigie.yml. Cette issue est relancée une fois par semaine, et se ferme d'elle-même quand l'échéance s'éloigne."
          } > corps.md
          python3 deploy/tenir_issue.py signaler --label cron-echeance \
            --titre "$titre" \
            --corps-fichier corps.md --etat "$etat" --relance-jours 7 --couleur C5DEF5 \
            --description "Les workflows planifiés approchent de leur extinction automatique"
